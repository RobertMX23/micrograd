[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "micrograd"
version = "0.1.0"
description = "A tiny scalar-valued autograd engine"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[dependency-groups]
dev = [
    "jupyter",
    "matplotlib",
    "numpy",
    "pytest>=8.3.5",
    "torch>=2.5.1",
]
